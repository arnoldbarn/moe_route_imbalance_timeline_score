[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arnoldbarn-multimodal_jd067"
version = "0.1.0"
description = "解析时间标记，排列多模态算法研究员·MoE 路由的负载不均的发生顺序，标出间隔异常与逆序事件"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "arnoldbarn" }]
keywords = ["analysis", "observability", "evaluation", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://arnoldbarn.github.io"
Repository = "https://github.com/arnoldbarn/multimodal_jd067"
Issues = "https://github.com/arnoldbarn/multimodal_jd067/issues"

[project.scripts]
multimodal_jd067 = "multimodal_jd067:main"

[tool.setuptools]
py-modules = ["multimodal_jd067"]
